<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Fleeting Circus platform architecture</title>
  <desc id="desc">Conceptual architecture showing clients, userservice, backend, Redis Streams, orchestrator, workers, Docker registry, object storage, PostgreSQL databases, and observability.</desc>
  <defs>
    <style>
      .bg { fill: #fff7ed; }
      .panel { fill: #fffdf8; stroke: #e7cdb7; stroke-width: 2; }
      .panel-title { font: 700 19px Inter, Arial, sans-serif; fill: #221714; }
      .title { font: 800 34px Inter, Arial, sans-serif; fill: #221714; }
      .subtitle { font: 400 17px Inter, Arial, sans-serif; fill: #6b5a50; }
      .node { fill: #ffffff; stroke: #dcb99e; stroke-width: 2; }
      .node-blue { fill: #eef7ff; stroke: #72b7f2; stroke-width: 2; }
      .node-orange { fill: #fff0e8; stroke: #ef8d6f; stroke-width: 2; }
      .node-green { fill: #edfbf4; stroke: #71c49a; stroke-width: 2; }
      .node-yellow { fill: #fff6dc; stroke: #e5b83f; stroke-width: 2; }
      .node-red { fill: #fff0f0; stroke: #d86c6c; stroke-width: 2; }
      .label { font: 700 17px Inter, Arial, sans-serif; fill: #221714; }
      .small { font: 400 13px Inter, Arial, sans-serif; fill: #6b5a50; }
      .tiny { font: 600 11px Inter, Arial, sans-serif; fill: #6b5a50; letter-spacing: .4px; }
      .arrow { stroke: #6b5a50; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow2 { stroke: #ef5b42; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke-dasharray: 7 7; }
      .store { fill: #ffffff; stroke: #dcb99e; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b5a50"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ef5b42"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="920"/>
  <text class="title" x="60" y="70">Platform Architecture</text>
  <text class="subtitle" x="60" y="102">Users call platform APIs. The orchestrator coordinates V2 jobs. Workers execute builds and invocations in Docker.</text>

  <rect class="panel" x="45" y="140" width="270" height="680" rx="18"/>
  <text class="panel-title" x="75" y="180">User edge</text>
  <rect class="node-blue" x="85" y="230" width="170" height="78" rx="14"/>
  <text class="label" x="170" y="262" text-anchor="middle">Browser UI</text>
  <text class="small" x="170" y="286" text-anchor="middle">React frontend</text>
  <rect class="node-blue" x="85" y="370" width="170" height="78" rx="14"/>
  <text class="label" x="170" y="402" text-anchor="middle">API client</text>
  <text class="small" x="170" y="426" text-anchor="middle">curl, app, Postman</text>
  <rect class="node" x="85" y="560" width="170" height="78" rx="14"/>
  <text class="label" x="170" y="592" text-anchor="middle">Nginx</text>
  <text class="small" x="170" y="616" text-anchor="middle">HTTPS gateway</text>

  <rect class="panel" x="365" y="140" width="370" height="680" rx="18"/>
  <text class="panel-title" x="395" y="180">Control plane APIs</text>
  <rect class="node-green" x="450" y="225" width="205" height="82" rx="14"/>
  <text class="label" x="552" y="258" text-anchor="middle">Userservice</text>
  <text class="small" x="552" y="282" text-anchor="middle">register, login, JWT</text>
  <rect class="node-orange" x="450" y="370" width="205" height="96" rx="14"/>
  <text class="label" x="552" y="404" text-anchor="middle">Backend API</text>
  <text class="small" x="552" y="428" text-anchor="middle">functions, builds, invokes</text>
  <text class="small" x="552" y="448" text-anchor="middle">inputs, outputs, status</text>
  <rect class="node-yellow" x="450" y="575" width="205" height="88" rx="14"/>
  <text class="label" x="552" y="609" text-anchor="middle">OpenAPI docs</text>
  <text class="small" x="552" y="633" text-anchor="middle">frontend contract</text>

  <rect class="panel" x="780" y="140" width="285" height="680" rx="18"/>
  <text class="panel-title" x="810" y="180">Coordination</text>
  <rect class="node-red" x="830" y="240" width="185" height="90" rx="14"/>
  <text class="label" x="922" y="275" text-anchor="middle">Redis Streams</text>
  <text class="small" x="922" y="299" text-anchor="middle">job events + leases</text>
  <rect class="node-red" x="830" y="425" width="185" height="96" rx="14"/>
  <text class="label" x="922" y="459" text-anchor="middle">Orchestrator</text>
  <text class="small" x="922" y="483" text-anchor="middle">dispatch, claim</text>
  <text class="small" x="922" y="503" text-anchor="middle">recover, finalize</text>
  <rect class="node" x="830" y="635" width="185" height="72" rx="14"/>
  <text class="label" x="922" y="665" text-anchor="middle">Projectors</text>
  <text class="small" x="922" y="689" text-anchor="middle">read model updates</text>

  <rect class="panel" x="1110" y="140" width="245" height="680" rx="18"/>
  <text class="panel-title" x="1140" y="180">Execution plane</text>
  <rect class="node-blue" x="1145" y="230" width="175" height="88" rx="14"/>
  <text class="label" x="1232" y="264" text-anchor="middle">Worker 1..N</text>
  <text class="small" x="1232" y="288" text-anchor="middle">Docker executor</text>
  <rect class="node-yellow" x="1145" y="390" width="175" height="78" rx="14"/>
  <text class="label" x="1232" y="422" text-anchor="middle">Warm pool</text>
  <text class="small" x="1232" y="446" text-anchor="middle">resident containers</text>
  <rect class="node" x="1145" y="560" width="175" height="78" rx="14"/>
  <text class="label" x="1232" y="592" text-anchor="middle">Registry</text>
  <text class="small" x="1232" y="616" text-anchor="middle">function images</text>

  <ellipse class="store" cx="560" cy="760" rx="104" ry="42"/>
  <text class="label" x="560" y="754" text-anchor="middle">PostgreSQL</text>
  <text class="small" x="560" y="778" text-anchor="middle">metadata + accounts</text>

  <ellipse class="store" cx="925" cy="760" rx="100" ry="42"/>
  <text class="label" x="925" y="754" text-anchor="middle">Parspack S3</text>
  <text class="small" x="925" y="778" text-anchor="middle">sources, inputs, outputs</text>

  <rect class="node-green" x="1145" y="700" width="175" height="72" rx="14"/>
  <text class="label" x="1232" y="729" text-anchor="middle">Observability</text>
  <text class="small" x="1232" y="753" text-anchor="middle">Grafana stack</text>

  <path class="arrow" d="M255 269 C310 269 380 266 450 266"/>
  <path class="arrow" d="M255 409 C330 409 380 418 450 418"/>
  <path class="arrow" d="M170 560 L170 500 C260 500 337 448 450 428"/>
  <path class="arrow" d="M552 307 L552 370"/>
  <path class="arrow" d="M655 418 C720 418 760 300 830 285"/>
  <path class="arrow" d="M1015 285 C1070 285 1095 274 1145 274"/>
  <path class="arrow" d="M1015 473 C1075 473 1095 274 1145 274"/>
  <path class="arrow" d="M1145 274 C1080 330 1060 410 1015 473"/>
  <path class="arrow" d="M1232 318 L1232 390"/>
  <path class="arrow" d="M1232 468 L1232 560"/>
  <path class="arrow" d="M552 466 L552 718"/>
  <path class="arrow" d="M655 438 C750 470 820 610 900 718"/>
  <path class="arrow dash" d="M1232 638 L1232 700"/>
  <path class="arrow dash" d="M1015 473 C1090 560 1110 690 1145 728"/>
  <path class="arrow2" d="M830 473 C765 473 725 440 655 428"/>

  <text class="tiny" x="695" y="391">create job event</text>
  <text class="tiny" x="1048" y="252">worker streams</text>
  <text class="tiny" x="689" y="463">status/results</text>
  <text class="tiny" x="724" y="671">artifact APIs</text>
</svg>
