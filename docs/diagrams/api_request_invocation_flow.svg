<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">API request invocation flow</title>
  <desc id="desc">Invocation request flow from caller through backend, Redis Stream, orchestrator, worker execution, staged artifacts, finalization, polling, and ZIP download.</desc>
  <defs>
    <style>
      .bg { fill: #fff7ed; }
      .title { font: 800 34px Inter, Arial, sans-serif; fill: #221714; }
      .subtitle { font: 400 17px Inter, Arial, sans-serif; fill: #6b5a50; }
      .lane { fill: #fffdf8; stroke: #e7cdb7; stroke-width: 2; }
      .step { fill: #ffffff; stroke: #dcb99e; stroke-width: 2; }
      .backend { fill: #fff0e8; stroke: #ef8d6f; stroke-width: 2; }
      .orch { fill: #fff6dc; stroke: #e5b83f; stroke-width: 2; }
      .worker { fill: #eef7ff; stroke: #72b7f2; stroke-width: 2; }
      .store { fill: #edfbf4; stroke: #71c49a; stroke-width: 2; }
      .terminal { fill: #f0fff7; stroke: #2e9c6d; stroke-width: 2; }
      .warn { fill: #fff0f0; stroke: #c44536; stroke-width: 2; }
      .lane-label { font: 800 18px Inter, Arial, sans-serif; fill: #221714; }
      .label { font: 800 15px Inter, Arial, sans-serif; fill: #221714; }
      .small { font: 400 12.5px Inter, Arial, sans-serif; fill: #6b5a50; }
      .tiny { font: 700 10.5px Inter, Arial, sans-serif; fill: #ef5b42; letter-spacing: .5px; }
      .arrow { stroke: #6b5a50; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .redarrow { stroke: #ef5b42; stroke-width: 2; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke-dasharray: 7 7; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b5a50"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ef5b42"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="930"/>
  <text class="title" x="60" y="70">API Request Invocation Flow</text>
  <text class="subtitle" x="60" y="102">Async is the durable path. Sync uses the same job path but waits briefly for a terminal JSON-only result.</text>

  <rect class="lane" x="55" y="150" width="270" height="650" rx="22"/>
  <text class="lane-label" x="85" y="190">Caller</text>
  <rect class="step" x="90" y="240" width="200" height="76" rx="14"/>
  <text class="label" x="190" y="270" text-anchor="middle">Invoke API</text>
  <text class="small" x="190" y="292" text-anchor="middle">JWT, token, or public</text>
  <rect class="step" x="90" y="610" width="200" height="76" rx="14"/>
  <text class="label" x="190" y="640" text-anchor="middle">Poll or wait</text>
  <text class="small" x="190" y="662" text-anchor="middle">simple or advanced response</text>
  <rect class="terminal" x="90" y="705" width="200" height="58" rx="14"/>
  <text class="label" x="190" y="730" text-anchor="middle">Download ZIP</text>
  <text class="small" x="190" y="750" text-anchor="middle">if still retained</text>

  <rect class="lane" x="365" y="150" width="285" height="650" rx="22"/>
  <text class="lane-label" x="395" y="190">Backend</text>
  <rect class="backend" x="405" y="240" width="205" height="76" rx="14"/>
  <text class="label" x="508" y="270" text-anchor="middle">Validate request</text>
  <text class="small" x="508" y="292" text-anchor="middle">access + contract + files</text>
  <rect class="backend" x="405" y="365" width="205" height="76" rx="14"/>
  <text class="label" x="508" y="395" text-anchor="middle">Create invocation</text>
  <text class="small" x="508" y="417" text-anchor="middle">metadata + read token</text>
  <rect class="store" x="405" y="490" width="205" height="76" rx="14"/>
  <text class="label" x="508" y="520" text-anchor="middle">Store inputs</text>
  <text class="small" x="508" y="542" text-anchor="middle">object storage artifacts</text>
  <rect class="backend" x="405" y="630" width="205" height="76" rx="14"/>
  <text class="label" x="508" y="660" text-anchor="middle">Read status/result</text>
  <text class="small" x="508" y="682" text-anchor="middle">never exposes staged files</text>

  <rect class="lane" x="690" y="150" width="285" height="650" rx="22"/>
  <text class="lane-label" x="720" y="190">Redis + Orchestrator</text>
  <rect class="orch" x="730" y="240" width="205" height="76" rx="14"/>
  <text class="label" x="833" y="270" text-anchor="middle">job.created stream</text>
  <text class="small" x="833" y="292" text-anchor="middle">event enters V2 path</text>
  <rect class="orch" x="730" y="365" width="205" height="76" rx="14"/>
  <text class="label" x="833" y="395" text-anchor="middle">Dispatch worker</text>
  <text class="small" x="833" y="417" text-anchor="middle">warm-aware + least loaded</text>
  <rect class="orch" x="730" y="490" width="205" height="76" rx="14"/>
  <text class="label" x="833" y="520" text-anchor="middle">Claim + lease</text>
  <text class="small" x="833" y="542" text-anchor="middle">attempt fencing</text>
  <rect class="orch" x="730" y="630" width="205" height="76" rx="14"/>
  <text class="label" x="833" y="660" text-anchor="middle">Complete + finalize</text>
  <text class="small" x="833" y="682" text-anchor="middle">terminal state after commit</text>

  <rect class="lane" x="1015" y="150" width="285" height="650" rx="22"/>
  <text class="lane-label" x="1045" y="190">Worker</text>
  <rect class="worker" x="1055" y="240" width="205" height="76" rx="14"/>
  <text class="label" x="1158" y="270" text-anchor="middle">Consume stream</text>
  <text class="small" x="1158" y="292" text-anchor="middle">assigned delivery</text>
  <rect class="worker" x="1055" y="365" width="205" height="76" rx="14"/>
  <text class="label" x="1158" y="395" text-anchor="middle">Fetch payload</text>
  <text class="small" x="1158" y="417" text-anchor="middle">source image + inputs</text>
  <rect class="worker" x="1055" y="490" width="205" height="76" rx="14"/>
  <text class="label" x="1158" y="520" text-anchor="middle">Run function</text>
  <text class="small" x="1158" y="542" text-anchor="middle">warm or cold container</text>
  <rect class="worker" x="1055" y="630" width="205" height="76" rx="14"/>
  <text class="label" x="1158" y="660" text-anchor="middle">Upload staged output</text>
  <text class="small" x="1158" y="682" text-anchor="middle">runner fast path where possible</text>

  <rect class="lane" x="1340" y="150" width="210" height="650" rx="22"/>
  <text class="lane-label" x="1370" y="190">Artifacts</text>
  <rect class="store" x="1365" y="270" width="160" height="76" rx="14"/>
  <text class="label" x="1445" y="300" text-anchor="middle">S3 files</text>
  <text class="small" x="1445" y="322" text-anchor="middle">inputs/outputs/logs</text>
  <rect class="warn" x="1365" y="490" width="160" height="76" rx="14"/>
  <text class="label" x="1445" y="520" text-anchor="middle">STAGED</text>
  <text class="small" x="1445" y="542" text-anchor="middle">hidden until commit</text>
  <rect class="terminal" x="1365" y="630" width="160" height="76" rx="14"/>
  <text class="label" x="1445" y="660" text-anchor="middle">COMMITTED</text>
  <text class="small" x="1445" y="682" text-anchor="middle">visible to caller</text>

  <path class="arrow" d="M290 278 L405 278"/>
  <path class="arrow" d="M508 316 L508 365"/>
  <path class="arrow" d="M508 441 L508 490"/>
  <path class="arrow" d="M610 403 C660 403 685 278 730 278"/>
  <path class="arrow" d="M833 316 L833 365"/>
  <path class="arrow" d="M935 403 C990 403 1010 278 1055 278"/>
  <path class="arrow" d="M1158 316 L1158 365"/>
  <path class="arrow" d="M1055 403 C995 403 980 528 935 528"/>
  <path class="arrow" d="M935 528 C990 528 1010 403 1055 403"/>
  <path class="arrow" d="M1158 441 L1158 490"/>
  <path class="arrow" d="M1158 566 L1158 630"/>
  <path class="arrow" d="M1260 668 C1305 668 1320 528 1365 528"/>
  <path class="arrow" d="M1260 403 C1320 403 1340 308 1365 308"/>
  <path class="redarrow" d="M1158 706 C1060 770 960 705 935 668"/>
  <path class="arrow" d="M935 668 C1020 750 1260 750 1365 668"/>
  <path class="arrow" d="M1365 668 C1050 820 675 710 610 668"/>
  <path class="arrow" d="M405 668 L290 648"/>
  <path class="arrow dash" d="M405 730 L290 734"/>

  <text class="tiny" x="990" y="340">claim is confirmed by orchestrator response</text>
  <text class="tiny" x="1228" y="604">outputs are uploaded before completion report</text>
  <text class="tiny" x="1030" y="760">completion transfers responsibility to finalization</text>
  <text class="small" x="800" y="855" text-anchor="middle">If a worker dies after upload but before completion, staged artifacts remain hidden and can expire safely.</text>
</svg>
