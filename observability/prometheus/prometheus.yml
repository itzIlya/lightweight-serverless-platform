global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: backend
    metrics_path: /metrics/
    static_configs:
      - targets: ["backend:8000"]

  - job_name: userservice
    metrics_path: /metrics/
    static_configs:
      - targets: ["userservice:8100"]

  - job_name: orchestrator
    metrics_path: /metrics/
    authorization:
      type: Bearer
      credentials: change-me
    static_configs:
      - targets: ["orchestrator:8010"]

  - job_name: worker
    metrics_path: /metrics/
    static_configs:
      - targets: ["95.38.184.58:9102", "37.32.37.233:9102"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: userservice-postgres
    static_configs:
      - targets: ["userservice-postgres-exporter:9187"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
