services:
  postgres:
    image: docker.arvancloud.ir/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serverless}
      POSTGRES_USER: ${POSTGRES_USER:-serverless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serverless}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  userservice-postgres:
    image: docker.arvancloud.ir/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${USERSERVICE_POSTGRES_DB:-userservice}
      POSTGRES_USER: ${USERSERVICE_POSTGRES_USER:-userservice}
      POSTGRES_PASSWORD: ${USERSERVICE_POSTGRES_PASSWORD:-userservice}
    ports:
      - "5433:5432"
    volumes:
      - userservice-postgres-data:/var/lib/postgresql/data

  redis:
    image: docker.arvancloud.ir/redis:7
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  registry:
    image: docker.arvancloud.ir/registry:2
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry

  userservice:
    build:
      context: .
      dockerfile: userservice/Dockerfile
    restart: unless-stopped
    command: gunicorn userservice.wsgi:application --bind 0.0.0.0:8100 --workers 2 --timeout 120
    env_file:
      - .env.control-plane
    environment:
      USERSERVICE_POSTGRES_HOST: userservice-postgres
      USERSERVICE_JWT_KEY_PATH: /app/keys/jwt_private.pem
    volumes:
      - userservice-keys:/app/keys
    ports:
      - "8100:8100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8100/health/', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      userservice-postgres:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: gunicorn serverless_platform.wsgi:application --bind 0.0.0.0:8000 --worker-class gthread --workers ${BACKEND_GUNICORN_WORKERS:-4} --threads ${BACKEND_GUNICORN_THREADS:-4} --timeout 120
    env_file:
      - .env.control-plane
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      BACKEND_BASE_URL: http://backend:8000
      ORCHESTRATOR_BASE_URL: http://orchestrator:8010
      USERSERVICE_JWKS_URL: http://userservice:8100/api/auth/jwks/
      REGISTRY_INTERNAL_BASE_URL: http://registry:5000
    volumes:
      - backend-media:/app/media
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      registry:
        condition: service_started
      userservice:
        condition: service_healthy

  outbox-relay:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python manage.py relay_outbox --poll-seconds 0.2
    restart: unless-stopped
    env_file:
      - .env.control-plane
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      ORCHESTRATOR_EVENT_STREAM: orchestrator:events
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  orchestrator:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: python scheduler/production_orchestrator.py
    restart: unless-stopped
    env_file:
      - .env.control-plane
    environment:
      REDIS_URL: redis://redis:6379/0
      ORCHESTRATOR_PORT: 8010
      ORCHESTRATOR_JOB_LEASE_SECONDS: 30
      ORCHESTRATOR_RECONCILE_INTERVAL_SECONDS: 5
    ports:
      - "8010:8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      redis:
        condition: service_healthy
      outbox-relay:
        condition: service_started

  orchestrator-projector:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python manage.py project_orchestrator_events
    restart: unless-stopped
    env_file:
      - .env.control-plane
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  invocation-finalizer:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: python scheduler/invocation_finalizer.py
    restart: unless-stopped
    env_file:
      - .env.control-plane
    environment:
      REDIS_URL: redis://redis:6379/0
      BACKEND_BASE_URL: http://backend:8000
      ORCHESTRATOR_BASE_URL: http://orchestrator:8010
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      orchestrator:
        condition: service_healthy

  orchestrator-reconciler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python manage.py reconcile_orchestrator --interval-seconds 300 --batch-size 100
    restart: unless-stopped
    env_file:
      - .env.control-plane
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      ORCHESTRATOR_BASE_URL: http://orchestrator:8010
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      orchestrator:
        condition: service_healthy

  staged-artifact-cleaner:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python manage.py cleanup_staged_invocations --interval-seconds 60
    restart: unless-stopped
    env_file:
      - .env.control-plane
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - backend-media:/app/media
    depends_on:
      postgres:
        condition: service_started
      backend:
        condition: service_healthy

  orphan-image-cleaner:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: python scheduler/orphan_image_cleaner.py
    restart: unless-stopped
    env_file:
      - .env.control-plane
    environment:
      REDIS_URL: redis://redis:6379/0
      REGISTRY_INTERNAL_BASE_URL: http://registry:5000
    depends_on:
      redis:
        condition: service_healthy
      registry:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
      userservice:
        condition: service_healthy

  nginx:
    image: docker.arvancloud.ir/nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/auth:/etc/nginx/auth:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      userservice:
        condition: service_healthy
      frontend:
        condition: service_started
      grafana:
        condition: service_started

  prometheus:
    image: docker.arvancloud.ir/prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      userservice:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      redis-exporter:
        condition: service_started
      postgres-exporter:
        condition: service_started
      userservice-postgres-exporter:
        condition: service_started
      cadvisor:
        condition: service_started

  grafana:
    image: docker.arvancloud.ir/grafana/grafana:11.2.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_DOMAIN: ${PUBLIC_DOMAIN:-fleetingcircus.ir}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

  loki:
    image: docker.arvancloud.ir/grafana/loki:3.2.1
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
      - -reporting.enabled=false
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    image: docker.arvancloud.ir/grafana/alloy:v1.4.3
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started

  cadvisor:
    image: mirror-docker.runflare.com/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  redis-exporter:
    image: docker.arvancloud.ir/oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  postgres-exporter:
    image: docker.arvancloud.ir/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-serverless}:${POSTGRES_PASSWORD:-serverless}@postgres:5432/${POSTGRES_DB:-serverless}?sslmode=disable
    depends_on:
      postgres:
        condition: service_started

  userservice-postgres-exporter:
    image: docker.arvancloud.ir/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${USERSERVICE_POSTGRES_USER:-userservice}:${USERSERVICE_POSTGRES_PASSWORD:-userservice}@userservice-postgres:5432/${USERSERVICE_POSTGRES_DB:-userservice}?sslmode=disable
    depends_on:
      userservice-postgres:
        condition: service_started

volumes:
  postgres-data:
  userservice-postgres-data:
  userservice-keys:
  redis-data:
  registry-data:
  backend-media:
  prometheus-data:
  grafana-data:
  loki-data:
