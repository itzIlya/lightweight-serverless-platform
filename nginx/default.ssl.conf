map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name fleetingcircus.ir www.fleetingcircus.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name fleetingcircus.ir www.fleetingcircus.ir;

    ssl_certificate /etc/letsencrypt/live/fleetingcircus.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fleetingcircus.ir/privkey.pem;

    client_max_body_size 25m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
        proxy_pass http://userservice:8100;
    }

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location /health/ {
        proxy_pass http://backend:8000;
    }

    location /backend/docs/ {
        rewrite ^/backend/docs/?$ /api/docs/ break;
        proxy_pass http://backend:8000;
    }

    location /userservice/docs/ {
        rewrite ^/userservice/docs/?$ /api/docs/ break;
        proxy_pass http://userservice:8100;
    }

    location /grafana/ {
        auth_basic "Serverless observability";
        auth_basic_user_file /etc/nginx/auth/grafana.htpasswd;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://grafana:3000;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://frontend:5173;
    }
}
